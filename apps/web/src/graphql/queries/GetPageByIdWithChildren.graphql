# import PageFragment from "../fragments/PageFragment.graphql";
# import NodeWithFeaturedImageToMediaItemConnectionEdgeFragment from "../fragments/NodeWithFeaturedImageToMediaItemConnectionEdgeFragment.graphql";
# import MediaDetailsFragment from "../fragments/MediaDetails.graphql";
# import MediaItemFragment from "../fragments/MediaItem.graphql";
# import MediaSizeFragment from "../fragments/MediaSize.graphql";
# import HierarchicalContentNodeToContentNodeChildrenConnectionPageInfoFragment from "../fragments/HierarchicalContentNodeToContentNodeChildrenConnectionPageInfo.graphql";
# import HierarchicalContentNodeToContentNodeChildrenConnectionEdgeFragment from "../fragments/HierarchicalContentNodeToContentNodeChildrenConnectionEdge.graphql";

query GetPageByIdWithChildren($id: ID!) {
  page(id: $id) {
    ...PageFragment
    featuredImage {
      ...NodeWithFeaturedImageToMediaItemConnectionEdgeFragment
      node {
        ...MediaItemFragment
        mediaDetails {
          ...MediaDetailsFragment
          sizes {
            ...MediaSizeFragment
          }
        }
      }
    }
    children {
      pageInfo {
        ...HierarchicalContentNodeToContentNodeChildrenConnectionPageInfoFragment
      }
      edges {
        ...HierarchicalContentNodeToContentNodeChildrenConnectionEdgeFragment
        node {
          ... on Page {
            ...PageFragment
            featuredImage {
              ...NodeWithFeaturedImageToMediaItemConnectionEdgeFragment
              node {
                ...MediaItemFragment
                mediaDetails {
                  ...MediaDetailsFragment
                  sizes {
                    ...MediaSizeFragment
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
